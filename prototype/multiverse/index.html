<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EdVerse Multiverse</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
:root { --gold: #e9b45a; --ink: #eef1ee; --soft: #b9c4bf; --glass: rgba(10, 14, 16, 0.62); --line: rgba(238, 241, 238, 0.16); }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: #07090a; color: var(--ink); font-family: "Atkinson Hyperlegible", system-ui, sans-serif; overflow: hidden; }
#app, #app canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
#ui { position: fixed; inset: 0; pointer-events: none; padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); }
#ui.hidden { display: none; }
.top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.brand { font-family: "Bricolage Grotesque", system-ui, sans-serif; font-weight: 700; font-size: 18px; letter-spacing: -0.01em; text-shadow: 0 1px 8px rgba(0,0,0,.5); }
.brand span { color: var(--gold); font-weight: 700; }
.meta { font-family: "JetBrains Mono", monospace; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; display: flex; gap: 12px; color: var(--soft); }
.card { position: absolute; left: max(16px, env(safe-area-inset-left)); top: 64px; width: min(340px, calc(100% - 32px)); background: var(--glass); border: 1px solid var(--line); border-radius: 6px; padding: 14px 16px; backdrop-filter: blur(8px); }
.kicker { font-family: "JetBrains Mono", monospace; font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: #8fc78a; }
.kicker[data-kind="Projection"] { color: #e0a15a; }
.kicker[data-kind="What if"] { color: #b9a3e8; }
.name { font-family: "Bricolage Grotesque", system-ui, sans-serif; font-size: 26px; font-weight: 700; margin-top: 4px; }
.when { color: var(--gold); font-size: 13px; }
.blurb { margin: 8px 0 0; color: var(--soft); font-size: 14px; line-height: 1.45; }
.dial { position: absolute; right: max(16px, env(safe-area-inset-right)); top: 64px; display: flex; flex-direction: column; gap: 6px; pointer-events: auto; }
.uni { all: unset; cursor: pointer; display: grid; grid-template-columns: 22px 1fr; column-gap: 8px; align-items: baseline; background: var(--glass); border: 1px solid var(--line); border-radius: 6px; padding: 8px 12px; min-width: 170px; backdrop-filter: blur(8px); }
.uni b { font-family: "JetBrains Mono", monospace; font-size: 11px; color: var(--soft); grid-row: span 2; }
.uni span { font-weight: 700; font-size: 14px; }
.uni em { font-style: normal; font-family: "JetBrains Mono", monospace; font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: var(--soft); }
.uni.on { border-color: var(--gold); box-shadow: inset 0 0 0 1px var(--gold); }
.uni:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.rift { position: absolute; left: 50%; bottom: 56px; transform: translateX(-50%); background: var(--glass); border: 1px solid rgba(233,180,90,.5); border-radius: 99px; padding: 7px 14px; font-size: 13px; white-space: nowrap; backdrop-filter: blur(8px); }
.rift b { color: var(--gold); }
.help { position: absolute; left: 50%; bottom: max(16px, env(safe-area-inset-bottom)); transform: translateX(-50%); color: var(--soft); font-size: 12px; white-space: nowrap; text-shadow: 0 1px 6px rgba(0,0,0,.6); }
kbd { font-family: "JetBrains Mono", monospace; font-size: 10px; border: 1px solid var(--line); border-radius: 3px; padding: 1px 4px; margin: 0 1px; background: rgba(0,0,0,.35); }
.loader { position: fixed; inset: 0; display: grid; place-content: center; gap: 14px; background: radial-gradient(ellipse at 50% 60%, #1a1610, #07090a 70%); z-index: 10; transition: opacity .8s ease; text-align: center; }
.loader .brand { font-size: 28px; }
.loader .bar { width: min(320px, 70vw); height: 2px; background: var(--line); }
.loader .bar i { display: block; height: 100%; width: 0; background: var(--gold); transition: width .3s ease; }
.loader .step { font-family: "JetBrains Mono", monospace; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--soft); max-width: 80vw; }
.loader.done { opacity: 0; pointer-events: none; }
.loader.failed .step { color: #e07a6a; text-transform: none; letter-spacing: 0; font-size: 13px; }
@media (max-width: 720px) {
	.card { top: auto; bottom: 100px; }
	.dial { flex-direction: row; flex-wrap: wrap; top: 52px; left: max(16px, env(safe-area-inset-left)); right: auto; }
	.uni { min-width: 0; padding: 6px 10px; }
	.uni em { display: none; }
	.help { display: none; }
}
@media (prefers-reduced-motion: reduce) { .loader { transition: none; } }
</style>
</head>
<body>
<div id="app"></div>
<div id="ui"></div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
